<style>
  :root{
    --bg: #14120F;
    --surface: #1E1B17;
    --surface-2: #26221D;
    --line: #332E27;
    --cream: #F2ECDD;
    --muted: #9C9282;
    --brass: #C79A4B;
    --brass-dim: #8B6E3A;
    --teal: #4B8F84;
    --error: #B85C4A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #201C16 0%, var(--bg) 55%);
    color: var(--cream);
    font-family: 'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0;
  }
  .display{ font-family:'Fraunces', serif; }

  /* ---------- LOCK SCREEN ---------- */
  #lock-screen{
    width:100%;
    max-width:380px;
    text-align:center;
    animation: fadeIn .6s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .keyhole-wrap{
    width:96px; height:96px;
    margin: 0 auto 28px;
    border-radius:50%;
    background: var(--surface);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
    transition: box-shadow .5s ease, border-color .5s ease, transform .5s ease;
  }
  .keyhole-wrap.unlocked{
    border-color: var(--teal);
    box-shadow: 0 0 0 1px rgba(75,143,132,.3), 0 0 28px rgba(75,143,132,.4);
    transform: scale(1.04);
  }
  .keyhole-wrap img{ width:100%; height:100%; object-fit:cover; }

  #signup-screen{
    width:100%;
    max-width:380px;
    text-align:center;
    animation: fadeIn .6s ease;
  }
  #signup-screen h1{ font-size:1.5rem; font-weight:600; margin-bottom:6px; }
  #signup-screen p.sub{ color: var(--muted); font-size:.8rem; margin-bottom:32px; }
  #su-name, #su-pw{
    width:100%;
    background: var(--surface);
    border:1px solid var(--line);
    color: var(--cream);
    font-family:'IBM Plex Mono', monospace;
    font-size:.95rem;
    padding: 14px 16px;
    border-radius:6px;
    outline:none;
    text-align:center;
    margin-bottom:14px;
  }
  #su-name:focus, #su-pw:focus{ border-color: var(--brass); }
  #su-err{ color: var(--error); font-size:.78rem; margin-top:14px; min-height:1em; }
  .switch-mode{ margin-top:20px; font-size:.8rem; }
  .switch-mode a{ color: var(--brass); text-decoration:none; }
  .switch-mode a:hover{ text-decoration:underline; }

  #lock-screen h1{
    font-size: 1.5rem;
    font-weight:600;
    letter-spacing:.01em;
    margin-bottom:6px;
  }
  #lock-screen p.sub{
    color: var(--muted);
    font-size:.8rem;
    letter-spacing:.04em;
    margin-bottom:32px;
  }

  .field{
    position:relative;
    margin-bottom:14px;
  }
  input#pw{
    width:100%;
    background: var(--surface);
    border:1px solid var(--line);
    color: var(--cream);
    font-family:'IBM Plex Mono', monospace;
    font-size:.95rem;
    letter-spacing:.15em;
    padding: 14px 16px;
    border-radius:6px;
    outline:none;
    transition: border-color .2s ease;
    text-align:center;
  }
  input#pw:focus{ border-color: var(--brass); }
  input#pw::placeholder{ color:#5A5348; letter-spacing:.05em; }

  .btn{
    width:100%;
    padding: 13px 16px;
    background: var(--brass);
    color:#14120F;
    border:none;
    border-radius:6px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:.85rem;
    letter-spacing:.06em;
    cursor:pointer;
    transition: background .2s ease, transform .1s ease;
  }
  .btn:hover{ background:#D6AC5E; }
  .btn:active{ transform: scale(.98); }
  .btn:disabled{ opacity:.5; cursor:default; }

  #err{
    color: var(--error);
    font-size:.78rem;
    margin-top:14px;
    min-height:1em;
  }

  /* ---------- CHAT SCREEN ---------- */
  #chat-screen{
    display:none;
    width:100vw;
    height:100vh;
    max-width:none;
    background: var(--surface);
    border:none;
    border-radius:0;
    overflow:hidden;
    flex-direction:column;
    animation: fadeIn .5s ease;
  }
  header{
    padding: 24px 32px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--surface-2);
  }
  header svg{ width:26px; height:26px; flex-shrink:0; }
  header .htitle{ font-family:'Fraunces', serif; font-size:1.9rem; font-weight:600; }
  header .hsub{ color: var(--muted); font-size:1rem; margin-left:auto; letter-spacing:.04em; }
  #settings-btn{
    background:none;
    border:1px solid var(--line);
    color: var(--muted);
    width:34px; height:34px;
    border-radius:8px;
    font-size:1rem;
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  #settings-btn:hover{ border-color: var(--brass); color: var(--brass); }

  #settings-panel{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,9,7,.72);
    z-index:20;
    align-items:center;
    justify-content:center;
  }
  #settings-panel.open{ display:flex; }
  .settings-inner{
    width:100%;
    max-width:380px;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding: 28px;
  }
  .settings-inner h2{ font-size:1.3rem; margin-bottom:22px; }
  .settings-inner label{
    display:block;
    color: var(--muted);
    font-size:.75rem;
    letter-spacing:.05em;
    margin-bottom:8px;
    margin-top:18px;
  }
  .settings-inner label:first-of-type{ margin-top:0; }
  #set-name{
    width:100%;
    background: var(--bg);
    border:1px solid var(--line);
    color: var(--cream);
    font-family:'IBM Plex Mono', monospace;
    font-size:.9rem;
    padding: 11px 13px;
    border-radius:7px;
    outline:none;
  }
  #set-name:focus{ border-color: var(--brass); }
  #swatches{ display:flex; gap:10px; }
  .swatch{
    width:32px; height:32px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    transition: transform .15s ease, border-color .15s ease;
  }
  .swatch:hover{ transform: scale(1.1); }
  .swatch.selected{ border-color: var(--cream); }
  .settings-actions{
    display:flex;
    gap:10px;
    margin-top:26px;
  }
  .settings-actions .btn{ padding:11px 16px; font-size:.78rem; }
  .btn-ghost{
    background:transparent !important;
    color: var(--muted) !important;
    border:1px solid var(--line);
  }
  .btn-ghost:hover{ background: var(--surface-2) !important; }
  #modes-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .mode-row{
    display:flex; align-items:center; gap:8px;
    background: var(--bg); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; font-size:.8rem;
  }
  .mode-row .mname{ font-weight:600; color: var(--brass); min-width:60px; }
  .mode-row .mprompt{ flex:1; color: var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mode-row .mdel{ background:none; border:none; color: var(--error); cursor:pointer; font-size:.9rem; }
  .mode-add-row{ display:flex; gap:6px; margin-bottom:6px; }
  .mode-add-row input{
    background: var(--bg); border:1px solid var(--line); color: var(--cream);
    font-family:'IBM Plex Mono', monospace; font-size:.78rem;
    padding:8px 10px; border-radius:6px; outline:none;
  }
  #new-mode-name{ width:90px; flex-shrink:0; }
  #new-mode-prompt{ flex:1; min-width:0; }
  .mode-add-row .btn{ padding:8px 12px; font-size:.75rem; white-space:nowrap; }

  .wake-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .switch{ position:relative; display:inline-block; width:42px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch .slider{
    position:absolute; cursor:pointer; inset:0;
    background: var(--line); border-radius:24px;
    transition: background .2s ease;
  }
  .switch .slider::before{
    content:""; position:absolute; height:18px; width:18px;
    left:3px; bottom:3px; background: var(--cream);
    border-radius:50%; transition: transform .2s ease;
  }
  .switch input:checked + .slider{ background: var(--brass); }
  .switch input:checked + .slider::before{ transform: translateX(18px); }
  #wake-word{
    flex:1;
    background: var(--bg); border:1px solid var(--line); color: var(--cream);
    font-family:'IBM Plex Mono', monospace; font-size:.85rem;
    padding:10px 12px; border-radius:6px; outline:none;
  }
  #wake-word:focus{ border-color: var(--brass); }

  #messages{
    flex:1;
    overflow-y:auto;
    padding: 28px 32px;
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:900px;
    width:100%;
    margin:0 auto;
  }
  .msg{
    max-width:80%;
    padding: 14px 17px;
    border-radius:10px;
    font-size:1.02rem;
    line-height:1.6;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background: var(--brass-dim);
    color:#14120F;
    border-bottom-right-radius:3px;
  }
  .msg.assistant{
    align-self:flex-start;
    background: var(--surface-2);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }
  .msg.typing{ color: var(--muted); font-style:italic; }

  #mode-chips{
    display:flex;
    gap:8px;
    padding: 10px 32px 0;
    max-width:900px;
    width:100%;
    margin:0 auto;
    flex-wrap:wrap;
  }
  .mode-chip{
    background: var(--surface-2);
    border:1px solid var(--line);
    color: var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:.75rem;
    padding: 6px 12px;
    border-radius:20px;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .mode-chip:hover{ border-color: var(--brass); color: var(--brass); }
  .mode-chip.active{ background: var(--brass); color:#14120F; border-color: var(--brass); }

  #input-row{
    display:flex;
    gap:10px;
    padding: 20px 32px;
    border-top:1px solid var(--line);
    background: var(--surface-2);
    max-width:900px;
    width:100%;
    margin:0 auto;
  }
  #msg-input{
    flex:1;
    background: var(--bg);
    border:1px solid var(--line);
    color: var(--cream);
    font-family:'IBM Plex Mono', monospace;
    font-size:1rem;
    padding: 14px 16px;
    border-radius:7px;
    outline:none;
    resize:none;
  }
  #msg-input:focus{ border-color: var(--brass); }
  #send-btn{
    padding: 0 22px;
    background: var(--brass);
    color:#14120F;
    border:none;
    border-radius:7px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:.9rem;
    cursor:pointer;
  }
  #send-btn:disabled{ opacity:.4; cursor:default; }
  #mic-btn{
    padding: 0 16px;
    background: var(--surface-2);
    border:1px solid var(--line);
    color: var(--cream);
    border-radius:7px;
    font-size:1.05rem;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  #mic-btn:hover{ border-color: var(--brass); }
  #mic-btn.listening{
    background: var(--error);
    border-color: var(--error);
    animation: pulseMic 1s ease-in-out infinite;
  }
  @keyframes pulseMic{ 0%,100%{opacity:1;} 50%{opacity:.6;} }

  #mic-select-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 8px 32px 16px;
    max-width:900px;
    width:100%;
    margin:0 auto;
    font-size:.75rem;
    color: var(--muted);
  }
  #mic-select{
    flex:1;
    background: var(--surface-2);
    border:1px solid var(--line);
    color: var(--cream);
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem;
    padding: 6px 10px;
    border-radius:6px;
    outline:none;
  }
  #mic-select:focus{ border-color: var(--brass); }
  .mic-retry-btn{
    background:none;
    border:1px solid var(--line);
    color: var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:.72rem;
    padding: 6px 10px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .mic-retry-btn:hover{ border-color: var(--brass); color: var(--brass); }
  #mic-status{
    padding: 0 32px 10px;
    max-width:900px;
    width:100%;
    margin:0 auto;
    font-size:.72rem;
    color: var(--error);
    min-height:1em;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:4px; }
</style>
</head>

    <div id="settings-panel">

  const settingsPanel = document.getElementById('settings-panel');
  const setNameInput = document.getElementById('set-name');
  const swatchesEl = document.getElementById('swatches');
  const bgSwatchesEl = document.getElementById('bg-swatches');
  let pendingAccent = ACCENTS[0];
  let pendingBg = 0;

  function buildSwatches(){
    swatchesEl.innerHTML = '';
    ACCENTS.forEach(color => {
      const s = document.createElement('div');
      s.className = 'swatch';
      s.style.background = color;
      s.onclick = () => {
        pendingAccent = color;
        [...swatchesEl.children].forEach(c => c.classList.remove('selected'));
        s.classList.add('selected');
      };
      if(color === pendingAccent) s.classList.add('selected');
      swatchesEl.appendChild(s);
    });
  }

  function buildBgSwatches(){
    bgSwatchesEl.innerHTML = '';
    BACKGROUNDS.forEach((theme, i) => {
      const s = document.createElement('div');
      s.className = 'swatch';
      s.style.background = theme.bg;
      s.style.border = '2px solid ' + theme.line;
      s.onclick = () => {
        pendingBg = i;
        [...bgSwatchesEl.children].forEach(c => c.classList.remove('selected'));
        s.classList.add('selected');
      };
      if(i === pendingBg) s.classList.add('selected');
      bgSwatchesEl.appendChild(s);
    });
  }

  function applySettings(name, accent, bgIndex){
    document.getElementById('app-title').textContent = name;
    document.getElementById('lock-title').textContent = name;
    document.title = name;
    document.documentElement.style.setProperty('--brass', accent);
    document.documentElement.style.setProperty('--brass-dim', accent);
    const theme = BACKGROUNDS[bgIndex || 0];
    document.documentElement.style.setProperty('--bg', theme.bg);
    document.documentElement.style.setProperty('--surface', theme.surface);
    document.documentElement.style.setProperty('--surface-2', theme.surface2);
    document.documentElement.style.setProperty('--line', theme.line);
    document.documentElement.style.setProperty('--cream', theme.cream);
  }

  function loadSettings(){
    let saved = {};
    try{ saved = JSON.parse(localStorage.getItem('arthuria-settings') || '{}'); }catch(e){}
    const name = saved.name || 'ArthurIA';
    const accent = saved.accent || ACCENTS[0];
    const bgIndex = saved.bgIndex || 0;
    pendingAccent = accent;
    pendingBg = bgIndex;
    applySettings(name, accent, bgIndex);
  }

  // ---------- Modes (commandes slash) ----------
  function getModes(){
    try{ return JSON.parse(localStorage.getItem('arthuria-modes') || '{}'); }catch(e){ return {}; }
  }
  function setModes(modes){
    try{ localStorage.setItem('arthuria-modes', JSON.stringify(modes)); }catch(e){}
  }
  function renderModesList(){
    const modes = getModes();
    const listEl = document.getElementById('modes-list');
    listEl.innerHTML = '';
    const names = Object.keys(modes);
    if(names.length === 0){
      listEl.innerHTML = '<div class="mode-row"><span class="mprompt">aucun mode créé pour l\'instant</span></div>';
      return;
    }
    names.forEach(n => {
      const row = document.createElement('div');
      row.className = 'mode-row';
      row.innerHTML = '<span class="mname">/' + n + '</span><span class="mprompt"></span><button class="mdel">✕</button>';
      row.querySelector('.mprompt').textContent = modes[n];
      row.querySelector('.mdel').onclick = () => {
        const m = getModes();
        delete m[n];
        setModes(m);
        renderModesList();
        renderModeChips();
      };
      listEl.appendChild(row);
    });
  }
  function addMode(){
    const nameInput = document.getElementById('new-mode-name');
    const promptInput = document.getElementById('new-mode-prompt');
    const name = nameInput.value.trim().toLowerCase().replace(/\s+/g,'').replace(/^\/+/,'');
    const prompt = promptInput.value.trim();
    if(!name || !prompt) return;
    const modes = getModes();
    modes[name] = prompt;
    setModes(modes);
    nameInput.value = '';
    promptInput.value = '';
    renderModesList();
    renderModeChips();
  }

  function getWakeSettings(){
    try{ return JSON.parse(localStorage.getItem('arthuria-wake') || '{}'); }catch(e){ return {}; }
  }
  function setWakeSettings(w){
    try{ localStorage.setItem('arthuria-wake', JSON.stringify(w)); }catch(e){}
  }

  function openSettings(){
    if(currentUser !== "Arthur") return;
    let saved = {};
    try{ saved = JSON.parse(localStorage.getItem('arthuria-settings') || '{}'); }catch(e){}
    setNameInput.value = saved.name || 'ArthurIA';
    pendingAccent = saved.accent || ACCENTS[0];
    pendingBg = saved.bgIndex || 0;
    buildSwatches();
    buildBgSwatches();
    renderModesList();
    const wake = getWakeSettings();
    document.getElementById('wake-toggle').checked = !!wake.enabled;
    document.getElementById('wake-word').value = wake.word || 'Arthur';
    settingsPanel.classList.add('open');
  }

  function closeSettings(){
    settingsPanel.classList.remove('open');
  }

  function saveSettings(){
    const name = setNameInput.value.trim() || 'ArthurIA';
    try{
      localStorage.setItem('arthuria-settings', JSON.stringify({ name, accent: pendingAccent, bgIndex: pendingBg }));
    }catch(e){}
    applySettings(name, pendingAccent, pendingBg);
    const wakeEnabled = document.getElementById('wake-toggle').checked;
    const wakeWord = document.getElementById('wake-word').value.trim() || 'Arthur';
    setWakeSettings({ enabled: wakeEnabled, word: wakeWord });
    applyWakeState();
    closeSettings();
  }

  loadSettings();

  (function seedDefaultModes(){
    const modes = getModes();
    let changed = false;
    if(!modes['pro']){
      modes['pro'] = "Réponds de façon experte, précise et détaillée, comme un consultant professionnel. Va droit au but, structure tes réponses, et n'hésite pas à être technique si besoin.";
      changed = true;
    }
    if(!modes['promax']){
      modes['promax'] = "Donne la réponse la plus poussée, complète et rigoureuse possible. Explore plusieurs angles, anticipe les questions de suivi, structure avec des titres et sois exhaustif tout en restant clair. Vérifie ton raisonnement avant de répondre.";
      changed = true;
    }
    if(changed) setModes(modes);
  })();

  const lockScreen = document.getElementById('lock-screen');
  const chatScreen = document.getElementById('chat-screen');
  const keyhole = document.getElementById('keyhole');
  const err = document.getElementById('err');
  const pwInput = document.getElementById('pw');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const micBtn = document.getElementById('mic-btn');
  const micSelect = document.getElementById('mic-select');

  let history = [];

  // ---------- Choix du micro ----------
  let primedStream = null;

  async function populateMicList(){
    const statusEl = document.getElementById('mic-status');
    statusEl.textContent = '';
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      statusEl.textContent = "Ce navigateur ne permet pas d'accéder au micro ici.";
      return;
    }
    try{
      // demande la permission une première fois pour révéler les noms des micros
      const tmp = await navigator.mediaDevices.getUserMedia({ audio: true });
      tmp.getTracks().forEach(t => t.stop());
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter(d => d.kind === 'audioinput');
      const saved = localStorage.getItem('arthuria-mic') || '';
      micSelect.innerHTML = '<option value="">Micro par défaut</option>';
      mics.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = m.deviceId;
        opt.textContent = m.label || ('Micro ' + (i + 1));
        if(m.deviceId === saved) opt.selected = true;
        micSelect.appendChild(opt);
      });
      if(mics.length === 0){
        statusEl.textContent = "Aucun micro détecté sur cet appareil.";
      }
    } catch(e){
      if(e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError'){
        statusEl.textContent = "Accès au micro refusé — autorise-le dans les réglages du navigateur (icône cadenas à côté de l'adresse) puis clique sur \"actualiser\".";
      } else if(e.name === 'NotFoundError'){
        statusEl.textContent = "Aucun micro détecté.";
      } else {
        statusEl.textContent = "Impossible de lister les micros ici (" + e.name + "). Essaie depuis le fichier ouvert en local plutôt que dans ce panneau.";
      }
    }
  }
  micSelect.addEventListener('change', () => {
    try{ localStorage.setItem('arthuria-mic', micSelect.value); }catch(e){}
    primedStream = null;
  });
  populateMicList();

  async function primeMic(){
    const deviceId = micSelect.value;
    if(!deviceId) return;
    try{
      if(primedStream){ primedStream.getTracks().forEach(t => t.stop()); }
      primedStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: deviceId } } });
    }catch(e){}
  }

  // ---------- Reconnaissance vocale ----------
  let recognition = null;
  let isListening = false;
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SpeechRec){
    recognition = new SpeechRec();
    recognition.lang = 'fr-FR';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      msgInput.value = (msgInput.value ? msgInput.value + ' ' : '') + transcript;
      msgInput.focus();
    };
    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
    };
    recognition.onerror = () => {
      isListening = false;
      micBtn.classList.remove('listening');
    };
  } else {
    micBtn.style.display = 'none';
  }

  async function toggleMic(){
    if(!recognition) return;
    if(isListening){
      recognition.stop();
      isListening = false;
      micBtn.classList.remove('listening');
    } else {
      await primeMic();
      recognition.start();
      isListening = true;
      micBtn.classList.add('listening');
    }
  }

  // ---------- Mot de réveil ----------
  let wakeRecognition = null;
  let wakeActive = false;

  function speak(text){
    if(!window.speechSynthesis) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fr-FR';
    window.speechSynthesis.speak(utter);
  }

  function startWakeListener(){
    if(!SpeechRec || wakeActive) return;
    primeMic();
    wakeRecognition = new SpeechRec();
    wakeRecognition.lang = 'fr-FR';
    wakeRecognition.continuous = true;
    wakeRecognition.interimResults = false;

    wakeRecognition.onresult = (event) => {
      const last = event.results[event.results.length - 1];
      const transcript = last[0].transcript.trim();
      const wake = getWakeSettings();
      const word = (wake.word || 'Arthur').toLowerCase();
      const lower = transcript.toLowerCase();
      if(lower.includes(word)){
        const after = transcript.slice(lower.indexOf(word) + word.length).trim();
        if(after){
          msgInput.value = after;
          sendMessage();
        } else {
          speak("Oui, qu'est-ce que tu voudrais, " + currentUser + " ?");
        }
      }
    };
    wakeRecognition.onend = () => {
      if(wakeActive){
        try{ wakeRecognition.start(); }catch(e){}
      }
    };
    wakeRecognition.onerror = () => {
      if(wakeActive){
        try{ wakeRecognition.start(); }catch(e){}
      }
    };
    try{
      wakeRecognition.start();
      wakeActive = true;
    }catch(e){}
  }

  function stopWakeListener(){
    wakeActive = false;
    if(wakeRecognition){
      try{ wakeRecognition.stop(); }catch(e){}
      wakeRecognition = null;
    }
  }

  function applyWakeState(){
    const wake = getWakeSettings();
    if(wake.enabled){
      startWakeListener();
    } else {
      stopWakeListener();
    }
  }

  function getLocalAccounts(){
    try{ return JSON.parse(localStorage.getItem('arthuria-accounts') || '{}'); }catch(e){ return {}; }
  }

  function showSignup(){
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('signup-screen').style.display = 'block';
  }
  function showLogin(){
    document.getElementById('signup-screen').style.display = 'none';
    document.getElementById('lock-screen').style.display = 'block';
  }

  function trySignup(){
    const name = document.getElementById('su-name').value.trim();
    const pw = document.getElementById('su-pw').value;
    const suErr = document.getElementById('su-err');
    if(!name || !pw){
      suErr.textContent = "renseigne un prénom et un mot de passe";
      return;
    }
    if(ACCOUNTS[pw] || getLocalAccounts()[pw]){
      suErr.textContent = "ce mot de passe est déjà pris, choisis-en un autre";
      return;
    }
    const accounts = getLocalAccounts();
    accounts[pw] = name;
    try{ localStorage.setItem('arthuria-accounts', JSON.stringify(accounts)); }catch(e){}
    suErr.textContent = '';
    document.getElementById('signup-screen').style.display = 'none';
    lockScreen.style.display = 'block';
    pwInput.value = pw;
    tryUnlock();
  }

  function tryUnlock(){
    const allAccounts = Object.assign({}, ACCOUNTS, getLocalAccounts());
    const name = allAccounts[pwInput.value];
    if(name){
      currentUser = name;
      keyhole.classList.add('unlocked');
      err.textContent = '';
      setTimeout(()=>{
        lockScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        document.getElementById('hsub').textContent = name;
        if(name === "Arthur"){
          document.getElementById('settings-btn').style.display = '';
        }
        addMessage('assistant', "C'est ouvert, " + name + ". Je suis là — qu'est-ce que tu as en tête ?");
        renderModeChips();
        applyWakeState();
        msgInput.focus();
      }, 450);
    } else {
      err.textContent = "mot de passe incorrect";
      pwInput.value = '';
      pwInput.focus();
    }
  }
  pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });

  function addMessage(role, text){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  let currentMode = null;

  function renderModeChips(){
    const modes = getModes();
    const wrap = document.getElementById('mode-chips');
    wrap.innerHTML = '';
    const names = Object.keys(modes);
    if(names.length === 0) return;
    const normalChip = document.createElement('button');
    normalChip.className = 'mode-chip' + (currentMode ? '' : ' active');
    normalChip.textContent = 'normal';
    normalChip.onclick = () => { currentMode = null; renderModeChips(); };
    wrap.appendChild(normalChip);
    names.forEach(n => {
      const chip = document.createElement('button');
      chip.className = 'mode-chip' + (currentMode === n ? ' active' : '');
      chip.textContent = '/' + n;
      chip.onclick = () => { currentMode = n; renderModeChips(); };
      wrap.appendChild(chip);
    });
  }

  function handleSlashCommand(text){
    const parts = text.slice(1).trim().split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const modes = getModes();

    if(cmd === 'aide' || cmd === 'help'){
      addMessage('assistant', "Commandes disponibles :\n/mode — liste les modes\n/mode <nom> — active un mode\n/normal — revient au mode normal");
      return true;
    }
    if(cmd === 'normal'){
      currentMode = null;
      addMessage('assistant', "Mode normal réactivé.");
      renderModeChips();
      return true;
    }
    if(cmd === 'mode'){
      const modeName = parts.slice(1).join(' ').toLowerCase();
      if(!modeName){
        const names = Object.keys(modes);
        addMessage('assistant', names.length ? "Modes disponibles : " + names.map(n => '/'+n).join(', ') : "Aucun mode créé pour l'instant.");
        return true;
      }
      if(modes[modeName]){
        currentMode = modeName;
        addMessage('assistant', "Mode " + modeName + " activé.");
        renderModeChips();
      } else {
        addMessage('assistant', "Mode inconnu : " + modeName);
      }
      return true;
    }
    const joined = parts.join('').toLowerCase();
    if(joined !== cmd && modes[joined] !== undefined){
      currentMode = joined;
      addMessage('assistant', "Mode " + joined + " activé.");
      renderModeChips();
      return true;
    }
    if(modes[cmd] !== undefined){
      currentMode = cmd;
      addMessage('assistant', "Mode " + cmd + " activé.");
      renderModeChips();
      return true;
    }
    return false;
  }

  async function sendMessage(){
    const text = msgInput.value.trim();
    if(!text) return;
    addMessage('user', text);
    msgInput.value = '';

    if(text.startsWith('/')){
      if(handleSlashCommand(text)) return;
    }

    history.push({ role: 'user', content: text });
    sendBtn.disabled = true;

    const typingEl = addMessage('assistant', '…');
    typingEl.classList.add('typing');

    try{
      const modes = getModes();
      const bodyPayload = {
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: history
      };
      if(currentMode && modes[currentMode]){
        bodyPayload.system = modes[currentMode];
      }
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(bodyPayload)
      });
      const data = await response.json();
      const reply = (data.content || [])
        .map(b => b.text || '')
        .filter(Boolean)
        .join('\n') || "…";
      typingEl.classList.remove('typing');
      typingEl.textContent = reply;
      history.push({ role: 'assistant', content: reply });
    } catch(e){
      typingEl.classList.remove('typing');
      typingEl.textContent = "Erreur de connexion. Réessaie.";
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }
  msgInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
